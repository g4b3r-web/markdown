<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080808">
<title>Markdown</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark;background:#080808;color:#eee}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;width:100%;background:var(--bg);color:var(--fg)}
body{--bg:#080808;--fg:#ededed;--muted:#aaa;--line:#303030;--code:#171717;--link:#8ab4ff;transition:background .2s,color .2s}
body.light{color-scheme:light;--bg:#fff;--fg:#202124;--muted:#666;--line:#ddd;--code:#f2f2f2;--link:#145dcc}
#document{width:100%;min-height:100vh;padding:clamp(22px,5vw,72px);font-size:16px;line-height:1.75;overflow-wrap:anywhere}
#document:empty{display:none}
#editor{display:none;width:100%;min-height:100vh;padding:clamp(22px,5vw,72px);resize:none;border:0;outline:0;background:var(--bg);color:var(--fg);font:15px/1.7 ui-monospace,SFMono-Regular,monospace;tab-size:2}
body.editing #document{display:none}body.editing #editor{display:block}
#document h1,#document h2,#document h3,#document h4,#document h5,#document h6{line-height:1.25;letter-spacing:-.035em;margin:1.5em 0 .65em}
#document h1{font-size:2.35em}#document h2{font-size:1.8em}#document h3{font-size:1.4em}
#document p{margin:0 0 1.1em}#document a{color:var(--link)}
#document blockquote{margin:1.2em 0;padding:.15em 1em;border-left:3px solid var(--muted);color:var(--muted)}
#document pre{padding:1em;overflow:auto;background:var(--code);border:1px solid var(--line);border-radius:8px}
#document code{font-family:ui-monospace,SFMono-Regular,monospace;background:var(--code);padding:.12em .3em;border-radius:4px}
#document pre code{padding:0;background:none}
#document img{max-width:100%;height:auto}#document table{border-collapse:collapse;max-width:100%;display:block;overflow:auto}
#document th,#document td{border:1px solid var(--line);padding:.45em .75em}#document hr{border:0;border-top:1px solid var(--line);margin:2em 0}
#controls{position:fixed;top:14px;right:14px;display:flex;gap:8px;opacity:.18;transition:opacity .2s}
#controls:hover,#controls:focus-within{opacity:1}
#controls button{width:38px;height:38px;border:1px solid var(--line);border-radius:50%;background:var(--code);color:var(--fg);font-size:17px;cursor:pointer}
#file{display:none}
@media(max-width:600px){#document{padding:58px 20px 28px;font-size:15px}#document h1{font-size:2em}}
</style>
</head>
<body>
<main id="document" aria-live="polite"></main>\n<textarea id="editor" spellcheck="false" aria-label="Editar Markdown" placeholder="Digite ou cole seu Markdown aqui..."></textarea>
<nav id="controls" aria-label="Controles">
<button id="open" type="button" title="Abrir arquivo Markdown" aria-label="Abrir arquivo Markdown">↥</button>
<button id="mode" type="button" title="Editar Markdown" aria-label="Alternar entre visualizar e editar">✎</button>\n<button id="theme" type="button" title="Alternar tema Black/Light" aria-label="Alternar tema">◐</button>
</nav>
<input id="file" type="file" accept=".md,.markdown,.txt,text/markdown,text/plain">
<script>
const documentView=document.querySelector('#document');
const fileInput=document.querySelector('#file');
const themeButton=document.querySelector('#theme');\nconst editor=document.querySelector('#editor');\nconst modeButton=document.querySelector('#mode');\nlet markdownSource='';\nlet editing=false;

function escapeHTML(value){
 return value.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#39;");
}
function inlineMarkdown(value){
 const code=[];
 let text=escapeHTML(value);
 text=text.replace(/`([^`]+)`/g,(_,part)=>{code.push('<code>'+part+'</code>');return '%%CODE'+(code.length-1)+'%%';});
 text=text.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
 text=text.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
 text=text.replace(/\*(.+?)\*/g,'<em>$1</em>');
 text=text.replace(/~~(.+?)~~/g,'<del>$1</del>');
 return text.replace(/%%CODE(\d+)%%/g,(_,index)=>code[Number(index)]);
}
function renderMarkdown(markdown){
 const output=[];
 const lines=markdown.replace(/\r/g,'').split('\n');
 let paragraph=[],listType='',inCode=false,codeLines=[];
 const flushParagraph=()=>{if(paragraph.length){output.push('<p>'+inlineMarkdown(paragraph.join(' '))+'</p>');paragraph=[];}};
 const closeList=()=>{if(listType){output.push('</'+listType+'>');listType='';}};
 const flushBlocks=()=>{flushParagraph();closeList();};
 for(const line of lines){
  if(inCode){
   if(/^\s*```/.test(line)){output.push('<pre><code>'+escapeHTML(codeLines.join('\n'))+'</code></pre>');codeLines=[];inCode=false;}
   else codeLines.push(line);
   continue;
  }
  if(/^\s*```/.test(line)){flushBlocks();inCode=true;continue;}
  if(!line.trim()){flushBlocks();continue;}
  const heading=line.match(/^\s{0,3}(#{1,6})\s+(.+?)\s*#*$/);
  if(heading){flushBlocks();const level=heading[1].length;output.push('<h'+level+'>'+inlineMarkdown(heading[2])+'</h'+level+'>');continue;}
  if(/^\s{0,3}(---+|___+|\*\*\*+)\s*$/.test(line)){flushBlocks();output.push('<hr>');continue;}
  const quote=line.match(/^\s{0,3}>\s?(.*)$/);
  if(quote){flushBlocks();output.push('<blockquote>'+inlineMarkdown(quote[1])+'</blockquote>');continue;}
  const item=line.match(/^\s*(?:[-+*]|\d+\.)\s+(.+)$/);
  if(item){
   flushParagraph();
   const nextType=/^\s*\d+\./.test(line)?'ol':'ul';
   if(listType&&listType!==nextType)closeList();
   if(!listType){listType=nextType;output.push('<'+listType+'>');}
   output.push('<li>'+inlineMarkdown(item[1])+'</li>');
   continue;
  }
  closeList();
  paragraph.push(line.trim());
 }
 if(inCode)output.push('<pre><code>'+escapeHTML(codeLines.join('\n'))+'</code></pre>');
 flushBlocks();
 return output.join('\n');
}
function showMarkdown(text){markdownSource=text;editor.value=text;documentView.innerHTML=renderMarkdown(text);}\nfunction setMode(nextEditing){editing=nextEditing;document.body.classList.toggle('editing',editing);modeButton.textContent=editing?'▤':'✎';modeButton.title=editing?'Visualizar HTML':'Editar Markdown';modeButton.setAttribute('aria-label',modeButton.title);if(editing)editor.focus();else{markdownSource=editor.value;documentView.innerHTML=renderMarkdown(markdownSource);}}
function openFile(file){
 if(!file)return;
 if(!/\.(md|markdown|txt)$/i.test(file.name))return;
 const reader=new FileReader();
 reader.onload=()=>showMarkdown(String(reader.result||''));
 reader.readAsText(file);
}
document.querySelector('#open').addEventListener('click',()=>fileInput.click());\nmodeButton.addEventListener('click',()=>setMode(!editing));\neditor.addEventListener('input',()=>{markdownSource=editor.value;});
fileInput.addEventListener('change',event=>openFile(event.target.files[0]));
document.querySelector('#theme').addEventListener('click',()=>{
 document.body.classList.toggle('light');
 const light=document.body.classList.contains('light');
 themeButton.textContent=light?'☾':'☀';
 themeButton.title=light?'Tema Black':'Tema Light';
 document.querySelector('meta[name="theme-color"]').content=light?'#ffffff':'#080808';
 try{localStorage.setItem('markdown-theme',light?'light':'black');}catch{}
});
try{if(localStorage.getItem('markdown-theme')==='light'){document.body.classList.add('light');themeButton.textContent='☾';}}catch{}
document.addEventListener('dragover',event=>event.preventDefault());
document.addEventListener('drop',event=>{event.preventDefault();openFile(event.dataTransfer.files[0]);});
document.addEventListener('paste',event=>{
 const text=event.clipboardData?.getData('text/plain');
 if(text&&text.trim()){event.preventDefault();showMarkdown(text);if(editing)editor.value=text;}
});
</script>
</body>
</html>
